version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: ai-architect-db
    restart: always
    environment:
      MYSQL_DATABASE: ai_software_architect
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-architect-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=ai_software_architect
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-rootpassword}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-dGhpcy1pcy1hLXNlY3VyZS1kZWZhdWx0LXNlY3JldC1rZXktZm9yLWFpLXNvZnR3YXJlLWFyY2hpdGVjdC1iYWNrZW5kLXByb2plY3Q=}
      - JWT_COOKIE_SECURE=${JWT_COOKIE_SECURE:-false}
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-architect-frontend
    restart: always
    ports:
      - "80:80"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8080}
    depends_on:
      - backend

volumes:
  db_data:
